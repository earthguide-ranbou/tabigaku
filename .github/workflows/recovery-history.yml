name: Save website source history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Record immutable source version
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://earthguide.tabigaku.party/api/recovery';
          const commitResponse=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}`,{headers:{Authorization:`Bearer ${process.env.GH_READ_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!commitResponse.ok)throw new Error('Could not read source commit');
          const commit=await commitResponse.json();
          for(let attempt=0;attempt<10;attempt++){
            const requestURL=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);requestURL.searchParams.set('audience',endpoint);
            const identityResponse=await fetch(requestURL,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
            if(!identityResponse.ok)throw new Error('Could not verify workflow identity');
            const identity=await identityResponse.json();
            const result=await fetch(endpoint+'?op=source-event',{method:'POST',headers:{Authorization:`Bearer ${identity.value}`,'Content-Type':'application/json'},body:JSON.stringify({takenAt:commit.commit.committer.date,summary:commit.commit.message.split('\n')[0]})});
            if(result.ok){console.log('Source version saved');process.exit(0)}
            if(attempt===9)throw new Error('Source record pending; scheduled reconciliation will retry');
            await new Promise(resolve=>setTimeout(resolve,30000));
          }
          NODE
